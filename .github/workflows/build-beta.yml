name: Build beta installers

# Builds ScreenBuddy on GitHub's real Windows and macOS runners (not a local machine,
# not this repo's dev sandbox — both are needed for a working, native installer per OS;
# cross-building macOS from Windows/Linux is unreliable and unsigned Mac apps in
# particular need to actually run through Apple's own toolchain during packaging).
#
# Two ways to trigger, deliberately different behavior:
#   - "Run workflow" (workflow_dispatch) from the Actions tab: builds only, uploads
#     artifacts you can download and test. Does NOT touch the live update feed --
#     safe to run as often as you want without surprising anyone who already has
#     the app installed.
#   - Push a version tag (v*, e.g. `git tag v0.1.2 && git push origin v0.1.2`):
#     builds AND publishes the installer + electron-updater manifest to Vercel Blob
#     storage (scripts/publish-release.js), which is what existing installs actually
#     check against (electron/updater.js, every 4h). This is the "ship it for real"
#     trigger. Needs the BLOB_READ_WRITE_TOKEN repo secret set (Vercel dashboard ->
#     Storage -> your blob store -> read-write token -> GitHub repo Settings ->
#     Secrets and variables -> Actions).

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build:mac -- --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenBuddy-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/publish-release.js
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build:win -- --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenBuddy-windows
          path: dist/*.exe
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/publish-release.js
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
