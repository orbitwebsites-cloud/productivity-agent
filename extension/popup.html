<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font: 13px/1.4 system-ui, -apple-system, sans-serif; width: 260px; padding: 12px; color: #2a1e0f; }
  p { color: #555; margin: 0 0 10px; }
  button {
    width: 100%; padding: 9px; border: none; border-radius: 8px;
    background: #f0b429; cursor: pointer; font-weight: 600; font-size: 13px;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { margin-top: 8px; color: #555; }
</style>
</head>
<body>
  <p>Fills this page from your ScreenBuddy profile. Reviews only — it never submits anything for you.</p>
  <button id="fillBtn">Fill this page</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
