<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pesto</title>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
    -webkit-user-select:none; user-select:none; cursor:pointer; }
  @keyframes orbIdle {
    0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 8px 14px rgba(120,60,30,0.35)); }
    50% { transform: translateY(-4px) scale(1.02); filter: drop-shadow(0 12px 20px rgba(201,100,66,0.45)); }
  }
  #orb { position:absolute; inset:0; display:grid; place-items:center; }
  #orb img {
    width:84px; height:84px; object-fit:contain; -webkit-user-drag:none; pointer-events:none;
    filter: drop-shadow(0 8px 14px rgba(120,60,30,0.35));
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
    animation: orbIdle 3.6s ease-in-out infinite;
  }
  #orb:hover img {
    transform: translateY(-6px) scale(1.12);
    filter: drop-shadow(0 16px 28px rgba(201,100,66,0.55));
  }
  #orb:active img { transform: scale(0.95); transition-duration: 0.1s; }
</style>
</head>
<body>
  <div id="orb"><img src="../assets/pesto/screenbuddy_mascot_idle.png" alt="Pesto" /></div>
  <script src="orb.js"></script>
</body>
</html>
