<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pesto Warden</title>
<style>
  :root{ --coral:#c96442; --coral-light:#e0895f; --ink:#2f2b25; --muted:#8a8377; --stroke:rgba(60,50,40,.12); --shadow-coral:0 4px 12px rgba(201,100,66,0.25); --shadow-coral-lg:0 6px 16px rgba(201,100,66,0.35); --ease-out:cubic-bezier(0.16,1,0.3,1); }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden; -webkit-user-select:none; user-select:none; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  @keyframes countPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  .wrap{height:100vh; display:grid; place-items:center; -webkit-app-region:drag; background:rgba(47,39,31,0.45); backdrop-filter:blur(4px);}
  .card{position:relative; width:480px; padding:28px 32px; border-radius:22px;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(32px) saturate(160%); -webkit-backdrop-filter:blur(32px) saturate(160%);
    border:1px solid rgba(201,100,66,0.3); box-shadow:0 28px 70px rgba(80,60,40,.55), inset 0 1px 2px rgba(255,255,255,0.6);}
  .card::before{content:""; position:absolute; inset:0 0 auto 0; height:1px; border-radius:22px 22px 0 0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent); pointer-events:none;}
  .top{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .face{width:52px; height:52px; object-fit:contain; filter:drop-shadow(0 6px 10px rgba(201,100,66,.34));}
  .tag{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--coral);}
  .goal{font-size:13px; color:var(--muted); margin-top:2px;}
  .head{font-size:18px; color:var(--ink); font-weight:750; line-height:1.35; margin-bottom:10px;}
  .detail{font-size:13px; color:var(--muted); line-height:1.45; margin-bottom:16px;}
  .countrow{display:flex; align-items:center; gap:16px; margin-bottom:14px;}
  .count{width:96px; height:96px; display:grid; place-items:center; border-radius:20px;
    background:#fff; border:1px solid var(--stroke); color:var(--coral); font-size:56px; font-weight:850; animation:countPulse 2s ease-in-out infinite;}
  .bar{flex:1; height:9px; overflow:hidden; border-radius:999px; background:rgba(60,50,40,.08);}
  .fill{height:100%; width:100%; border-radius:999px; background:linear-gradient(90deg,var(--coral),var(--coral-light)); transition:width .25s linear;}
  .hint{font-size:13px; color:var(--muted);}
  .kbd{font-size:11px; border:1px solid rgba(60,50,40,.2); border-radius:6px; padding:1px 6px; background:#fff;}
  .actions{-webkit-app-region:no-drag; display:flex; gap:10px; margin-top:16px;}
  button{min-height:44px; border:none; cursor:pointer; border-radius:12px; padding:0 18px; font-size:13px; font-weight:700; transition:transform var(--ease-out) 0.15s, box-shadow var(--ease-out) 0.2s, filter var(--ease-out) 0.15s;}
  .stay{color:var(--coral); background:rgba(201,100,66,.08); border:1px solid rgba(201,100,66,.25);}
  .stay:hover{transform:translateY(-1px); box-shadow:var(--shadow-coral);}
  .hide{color:#fff; background:linear-gradient(140deg,var(--coral),var(--coral-light)); box-shadow:var(--shadow-coral);}
  .hide:hover{transform:translateY(-1px); box-shadow:var(--shadow-coral-lg); filter:brightness(1.04);}
  button:active{transform:scale(0.98);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <img class="face" src="../assets/pesto/screenbuddy_mascot_idle.png" alt="" />
        <div>
          <div class="tag">Pesto Warden</div>
          <div class="goal" id="goal">Guarding your focus</div>
        </div>
      </div>
      <div class="head" id="head">This looks like drift.</div>
      <div class="detail" id="detail">I can hide it safely. Nothing gets closed.</div>
      <div class="countrow">
        <div class="count" id="n">10</div>
        <div class="bar"><div class="fill" id="fill"></div></div>
      </div>
      <div class="hint">Press <span class="kbd">ESC</span> or ask for more time to cancel.</div>
      <div class="actions">
        <button class="stay" id="stay">Give me 5 min</button>
        <button class="hide" id="hide">Hide it now</button>
      </div>
    </div>
  </div>
  <script src="warden.js"></script>
</body>
</html>
