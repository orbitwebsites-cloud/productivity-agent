<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pesto Warden</title>
<link rel="stylesheet" href="design-tokens.css" />
<style>
  @keyframes countPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  @keyframes glassShine{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  html,body{height:100%; overflow:hidden; -webkit-user-select:none; user-select:none; font-family:var(--font-sans);}
  .wrap{height:100vh; display:grid; place-items:center; -webkit-app-region:drag;
    background:rgba(0,0,0,0.5); backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur));}
  .card{width:480px; padding:28px 32px; border-radius:var(--radius-xl); position:relative; overflow:hidden;
    background:var(--glass-bg); backdrop-filter:var(--glass-blur-strong); -webkit-backdrop-filter:var(--glass-blur-strong);
    border:1px solid var(--glass-border);
    box-shadow:var(--shadow-xl), 0 0 0 1px rgba(255,255,255,0.04) inset;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:30%;
    background:var(--glass-highlight-strong);pointer-events:none;}
  .top{display:flex; align-items:center; gap:12px; margin-bottom:14px; position:relative; z-index:1;}
  .face{width:52px; height:52px; object-fit:contain; filter:drop-shadow(0 8px 14px rgba(232,132,92,0.45));}
  .tag{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--coral);}
  .goal{font-size:13px; color:var(--muted); margin-top:2px;}
  .head{font-size:18px; color:var(--ink); font-weight:750; line-height:1.35; margin-bottom:10px; position:relative; z-index:1;}
  .detail{font-size:13px; color:var(--muted); line-height:1.45; margin-bottom:16px; position:relative; z-index:1;}
  .countrow{display:flex; align-items:center; gap:16px; margin-bottom:14px; position:relative; z-index:1;}
  .count{width:96px; height:96px; display:grid; place-items:center; border-radius:var(--radius-lg);
    background:var(--glass-bg); backdrop-filter:var(--glass-blur); border:1px solid var(--glass-border);
    color:var(--coral); font-size:56px; font-weight:850; animation:countPulse 2s ease-in-out infinite; position:relative; overflow:hidden;}
  .count::before{content:'';position:absolute;top:0;left:0;right:0;height:40%;
    background:var(--glass-highlight);pointer-events:none;}
  .bar{flex:1; height:9px; overflow:hidden; border-radius:var(--radius-full); background:rgba(255,255,255,0.06);}
  .fill{height:100%; width:100%; border-radius:var(--radius-full); background:linear-gradient(90deg,var(--coral),var(--coral-light)); transition:width .25s linear;}
  .hint{font-size:13px; color:var(--muted); position:relative; z-index:1;}
  .kbd{font-size:11px; border:1px solid var(--glass-border); border-radius:var(--radius-sm); padding:1px 6px; background:rgba(255,255,255,0.04); color:var(--muted);}
  .actions{-webkit-app-region:no-drag; display:flex; gap:10px; margin-top:16px; position:relative; z-index:1;}
  button{position:relative;overflow:hidden;min-height:44px; border:none; cursor:pointer; border-radius:var(--radius-md); padding:0 18px; font-size:13px; font-weight:700; transition:all var(--ease-out) 0.15s;}
  button::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;
    background:linear-gradient(180deg,rgba(255,255,255,0.15) 0%,transparent 100%);pointer-events:none;border-radius:inherit;}
  .stay{color:var(--coral); background:rgba(232,132,92,0.10); border:1px solid rgba(232,132,92,0.22);}
  .stay:hover{transform:translateY(-1px); box-shadow:0 8px 24px rgba(232,132,92,0.25);}
  .hide{color:#fff; background:linear-gradient(135deg,var(--coral),var(--coral-light)); box-shadow:0 8px 24px rgba(232,132,92,0.28);}
  .hide:hover{transform:translateY(-1px); box-shadow:0 14px 36px rgba(232,132,92,0.35); filter:brightness(1.08);}
  button:active{transform:scale(0.97);}
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <img class="face" src="../assets/pesto/screenbuddy_mascot_idle.png" alt="Pesto mascot" />
        <div>
          <div class="tag">Pesto Warden</div>
          <div class="goal" id="goal">Guarding your focus</div>
        </div>
      </div>
      <div class="head" id="head">This looks like drift.</div>
      <div class="detail" id="detail">I can hide it safely. Nothing gets closed.</div>
      <div class="countrow">
        <div class="count" id="n">10</div>
        <div class="bar"><div class="fill" id="fill"></div></div>
      </div>
      <div class="hint">Press <span class="kbd">ESC</span> or ask for more time to cancel.</div>
      <div class="actions">
        <button class="stay" id="stay">Give me 5 min</button>
        <button class="hide" id="hide">Hide it now</button>
      </div>
    </div>
  </div>
  <script src="warden.js"></script>
</body>
</html>
