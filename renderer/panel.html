<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pesto</title>
<link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="card">
    <div class="header">
      <img class="avatar" src="../assets/pesto/screenbuddy_mascot_idle.png" alt="Pesto" />
      <div class="who">
        <div class="name">Pesto</div>
        <div class="sub" id="statusline">here to help you find balance.</div>
      </div>
      <button id="gearBtn" class="icobtn" title="Open ScreenBuddy app" aria-label="Open ScreenBuddy app">⚙</button>
      <button id="closeBtn" class="icobtn close" title="Close" aria-label="Close chat">×</button>
    </div>

    <div class="chat" id="chat"></div>

    <div class="quick">
      <button class="chip" data-q="What was I working on yesterday?">yesterday?</button>
      <button class="chip" data-q="How productive was I today?">today?</button>
      <button class="chip" data-q="How productive was I this week?">this week?</button>
    </div>

    <div class="today">
      <div class="today-h">Today · by pursuit</div>
      <div id="pursuits" class="pursuits stagger-children"><div class="empty">Nothing tracked yet.</div></div>
    </div>

    <div class="inputbar">
      <input id="q" type="text" placeholder="Ask Pesto anything…" autocomplete="off" />
      <button id="send" aria-label="Send">➤</button>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
